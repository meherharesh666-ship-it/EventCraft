<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — EventCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-section {
    min-height: calc(100vh - 73px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    background: var(--bg-alt);
  }
  .auth-card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 36px;
  }
  .auth-eyebrow {
    text-align: center;
    color: var(--gold);
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .auth-card h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.9rem;
    text-align: center;
    margin-bottom: 8px;
  }
  .auth-sub {
    text-align: center;
    color: var(--bronze);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }
  .form-field-wrap { position: relative; }
  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 38px;
    background: none;
    border: none;
    color: var(--bronze);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
  }
  .toggle-pw:hover { color: var(--gold); }
  .form-error {
    background: rgba(201, 90, 90, 0.1);
    border: 1px solid rgba(201, 90, 90, 0.35);
    color: #E0938F;
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    display: none;
  }
  .form-error.show { display: block; }
  .pw-hint {
    font-size: 0.76rem;
    color: var(--bronze);
    margin-top: 6px;
  }
  .terms-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 22px;
    font-size: 0.82rem;
    color: var(--bronze);
  }
  .terms-row input { margin-top: 3px; }
  .terms-row a { color: var(--gold); }
  .terms-row a:hover { text-decoration: underline; }
  .auth-switch {
    text-align: center;
    margin-top: 22px;
    font-size: 0.88rem;
    color: var(--bronze);
  }
  .auth-switch a { color: var(--gold); font-weight: 500; }
  .auth-switch a:hover { text-decoration: underline; }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Event<span>Craft</span></a>
    <div class="nav-links">
      <a href="index.html#events">Events</a>
      <a href="index.html#about">About</a>
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn-ghost">Log In</a>
      <a href="register.html" class="btn-gold">Sign Up</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-card">
    <p class="auth-eyebrow">Join EventCraft</p>
    <h1>Create Account</h1>
    <p class="auth-sub">Sign up to start booking and managing events</p>

    <div class="form-error" id="formError"></div>

    <form id="registerForm" novalidate>
      <div class="form-row">
        <div class="form-field">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
        </div>
        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
      </div>

      <div class="form-field form-field-wrap">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
        <button type="button" class="toggle-pw" id="togglePw1">Show</button>
        <p class="pw-hint">At least 6 characters.</p>
      </div>

      <div class="form-field form-field-wrap">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="6">
        <button type="button" class="toggle-pw" id="togglePw2">Show</button>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-gold btn-lg btn-submit" id="submitBtn">Create Account</button>
      <p class="form-status" id="formStatus"></p>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>

<script>
  // Mobile nav toggle
  document.getElementById('navToggle').addEventListener('click', function () {
    document.querySelector('.nav-links').classList.toggle('open');
  });

  // Show/hide password toggles
  function wirePwToggle(btnId, fieldId) {
    const btn = document.getElementById(btnId);
    const field = document.getElementById(fieldId);
    btn.addEventListener('click', function () {
      const isPw = field.type === 'password';
      field.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? 'Hide' : 'Show';
    });
  }
  wirePwToggle('togglePw1', 'password');
  wirePwToggle('togglePw2', 'confirmPassword');

  // Register submit -> API call
  const registerForm = document.getElementById('registerForm');
  const formError = document.getElementById('formError');
  const formStatus = document.getElementById('formStatus');
  const submitBtn = document.getElementById('submitBtn');

  registerForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    formError.classList.remove('show');
    formStatus.textContent = '';

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const termsChecked = document.getElementById('terms').checked;

    if (!firstName || !lastName || !email || !password || !confirmPassword) {
      formError.textContent = 'Please fill in all required fields.';
      formError.classList.add('show');
      return;
    }
    if (password.length < 6) {
      formError.textContent = 'Password must be at least 6 characters.';
      formError.classList.add('show');
      return;
    }
    if (password !== confirmPassword) {
      formError.textContent = 'Passwords do not match.';
      formError.classList.add('show');
      return;
    }
    if (!termsChecked) {
      formError.textContent = 'Please accept the Terms of Service to continue.';
      formError.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
      const res = await fetch('http://localhost:3000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName, email, phone, password })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || 'Registration failed. Please try again.');
      }

      if (data.token) {
        localStorage.setItem('eventcraft_token', data.token);
      }

      formStatus.textContent = 'Account created! Redirecting to login...';
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 900);

    } catch (err) {
      formError.textContent = err.message || 'Something went wrong. Please try again.';
      formError.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>
