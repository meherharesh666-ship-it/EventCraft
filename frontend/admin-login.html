<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | EventCraft</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #15120f;
            color: #f5f1e8;
            min-height: 100vh;
        }

        /* Navbar */

        nav {
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            background: #100e0c;
            border-bottom: 1px solid #332e28;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: bold;
            color: white;
        }

        .logo span {
            color: #d6aa55;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .nav-links a {
            color: #eee;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #d6aa55;
        }

        .login-link {
            border: 1px solid #39342d;
            padding: 14px 28px;
            border-radius: 30px;
        }

        .signup-link {
            background: #d6aa55;
            color: #17130f !important;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
        }

        .admin-link {
            color: #d6aa55 !important;
        }

        /* Login Area */

        .login-section {
            min-height: calc(100vh - 96px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }

        .login-box {
            width: 500px;

            background: #1c1916;

            border: 1px solid #39342d;

            border-radius: 22px;

            padding: 50px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .small-title {
            text-align: center;
            color: #d6aa55;
            font-size: 16px;
            margin-bottom: 18px;
        }

        .login-box h1 {
            text-align: center;

            font-family: Georgia, serif;

            font-size: 42px;

            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;

            color: #9d8e7d;

            margin-bottom: 38px;

            font-size: 16px;
        }

        .form-field {
            margin-bottom: 22px;
        }

        .form-field label {
            display: block;

            color: #b99a6c;

            margin-bottom: 9px;

            font-size: 15px;
        }

        .form-field input {
            width: 100%;

            padding: 15px 16px;

            background: #11100e;

            color: white;

            border: 1px solid #39342d;

            border-radius: 9px;

            outline: none;

            font-size: 15px;
        }

        .form-field input:focus {
            border-color: #d6aa55;
        }

        .admin-btn {
            width: 100%;

            padding: 16px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #d6aa55;

            color: #17130f;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .admin-btn:hover {
            background: #e3bd70;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            color: #d6aa55;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #9d8e7d;

            text-decoration: none;
        }

        .back-link:hover {
            color: #d6aa55;
        }

        @media (max-width: 700px) {

            nav {
                padding: 0 25px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a:not(.login-link):not(.admin-link) {
                display: none;
            }

            .login-box {
                width: 100%;
                padding: 35px 25px;
            }

            .login-box h1 {
                font-size: 34px;
            }
        }
    </style>

</head>

<body>

    <!-- Navbar -->

    <nav>

        <div class="logo">
            Event<span>Craft</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Events</a>

            <a href="index.html#about">About</a>

            <a href="index.html#gallery">Gallery</a>

            <a href="index.html#contact">Contact</a>

            <a href="login.html" class="login-link">
                Log In
            </a>

            <a href="register.html" class="signup-link">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- Admin Login -->

    <section class="login-section">

        <div class="login-box">

            <div class="small-title">
                EventCraft Administration
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Login to manage your events and enquiries
            </p>


            <form id="adminLoginForm">

                <div class="form-field">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <div class="form-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-btn">
                    Login as Admin
                </button>

            </form>


            <p id="message"></p>


            <a href="index.html" class="back-link">
                ← Back to EventCraft
            </a>

        </div>

    </section>


   <script>
    const adminLoginForm = document.getElementById("adminLoginForm");

    adminLoginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch(
                "http://localhost:3000/api/admin/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message);
            }

            localStorage.setItem("eventcraft_admin_token", data.token);

            alert("Admin Login Successful!");

            window.location.href = "admin.html";

        } catch (error) {
            document.getElementById("message").innerText = error.message;
        }
    });
   </script>   

</body>

</html>
